function buildComp_v2(){
  var MN=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  var fmtM=function(m){var p=m.split('-');return MN[+p[1]-1]+' '+p[0].slice(2);};
  var fP=function(v){return v!=null?v.toFixed(1)+'%':'-';};
  var fN=function(v){return v!=null?v.toLocaleString('es-CO'):'-';};
  var fC=function(v){return v!=null?'$'+Math.round(v).toLocaleString('es-CO'):'-';};
  var fM=function(v){return v!=null?'$'+(v/1e6).toFixed(2)+'M':'-';};
  var fDelta=function(val,meta,higherBetter){
    var n=parseFloat(String(val).replace(/[^0-9.-]/g,''));
    var m=parseFloat(String(meta).replace(/[^0-9.-]/g,''));
    if(isNaN(n)||isNaN(m)||m===0)return '<span style="color:var(--dim)">—</span>';
    var pct=(n-m)/m*100;
    var ok=higherBetter!==false?n>=m:n<=m;
    var sign=pct>=0?'+':'';
    return '<span style="color:'+(ok?'#4ade80':'#f87171')+';font-size:11px;font-weight:700">'+sign+pct.toFixed(0)+'%</span>';
  };

  var avMonths=[...new Set(RAW.filter(r=>CONSTRUCTORA_IDX.includes(r[8])).map(r=>r[0].slice(0,7)))].sort();
  if(!_cMA)_cMA=avMonths[avMonths.length-2]||avMonths[0];
  if(!_cMB)_cMB=avMonths[avMonths.length-1]||avMonths[0];

  var selA=avMonths.map(function(m){return '<option value="'+m+'"'+(m===_cMA?' selected':'')+'>'+fmtM(m)+'</option>';}).join('');
  var selB=avMonths.map(function(m){return '<option value="'+m+'"'+(m===_cMB?' selected':'')+'>'+fmtM(m)+'</option>';}).join('');

  var controls='<div style="background:var(--card);border-radius:10px;padding:16px 20px;margin-bottom:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center">'+
    '<div style="display:flex;align-items:center;gap:10px">'+
      '<span style="font-size:12px;font-weight:700;color:var(--dim)">MES A</span>'+
      '<select onchange="_cMA=this.value;buildComp_v2()" style="padding:7px 12px;border-radius:8px;border:1px solid var(--accent-soft);background:var(--bg);color:var(--fg);font-family:Montserrat,sans-serif;font-size:12px;font-weight:600">'+selA+'</select>'+
    '</div>'+
    '<span style="font-size:18px;color:var(--dim);font-weight:300">vs</span>'+
    '<div style="display:flex;align-items:center;gap:10px">'+
      '<span style="font-size:12px;font-weight:700;color:var(--dim)">MES B</span>'+
      '<select onchange="_cMB=this.value;buildComp_v2()" style="padding:7px 12px;border-radius:8px;border:1px solid var(--accent-soft);background:var(--bg);color:var(--fg);font-family:Montserrat,sans-serif;font-size:12px;font-weight:600">'+selB+'</select>'+
    '</div>'+
    '<div style="display:flex;gap:6px;margin-left:auto">'+_cProjBtns()+'</div>'+
    '<div style="display:flex;gap:6px;border-left:1px solid var(--accent-soft);padding-left:16px">'+_cCanalBtns()+'</div>'+
  '</div>';

  var mA=_cMetrics(_cMA,_cPrj);
  var mB=_cMetrics(_cMB,_cPrj);
  var mt=_getMeta(_cPrj);

  if(!mA||!mB){
    document.getElementById('compContent').innerHTML=controls+'<p style="padding:24px;color:var(--dim)">Sin datos para alguno de los meses seleccionados.</p>';
    return;
  }

  var colA='#c9a96e', colB='#6db33f', colM='var(--dim)';

  // ── 5-col row CON meta: Indicador | Mes A | Δ Meta A | Mes B | Δ Meta B | Meta ──
  var rowM=function(label,vA,vB,meta,higherBetter,fmt){
    if(higherBetter===undefined)higherBetter=true;
    if(!fmt)fmt=fN;
    var na=parseFloat(String(vA).replace(/[^0-9.-]/g,''));
    var nb=parseFloat(String(vB).replace(/[^0-9.-]/g,''));
    var arrow='',arrowCol='var(--dim)';
    if(!isNaN(na)&&!isNaN(nb)&&na!==nb){
      var better=higherBetter?nb>na:nb<na;
      arrow=nb>na?' &#8593;':' &#8595;';
      arrowCol=better?'#4ade80':'#f87171';
    }
    var dA=meta!=null?fDelta(vA,meta,higherBetter):'';
    var dB=meta!=null?fDelta(vB,meta,higherBetter):'';
    var metaStr=meta!=null?fmt(meta):'-';
    return '<tr style="border-bottom:1px solid var(--accent-soft)">'+
      '<td style="padding:9px 12px;font-size:12px;color:var(--dim);font-weight:600">'+label+'</td>'+
      '<td style="padding:9px 10px;font-size:13px;font-weight:700;color:'+colA+';text-align:center">'+fmt(vA)+'</td>'+
      '<td style="padding:6px 8px;text-align:center;border-right:1px dashed var(--accent-soft)">'+dA+'</td>'+
      '<td style="padding:9px 10px;font-size:13px;font-weight:700;color:'+colB+';text-align:center">'+fmt(vB)+'<span style="color:'+arrowCol+';font-size:11px">'+arrow+'</span></td>'+
      '<td style="padding:6px 8px;text-align:center;border-right:1px dashed var(--accent-soft)">'+dB+'</td>'+
      '<td style="padding:9px 10px;font-size:11px;font-weight:600;color:'+colM+';text-align:center">'+metaStr+'</td>'+
    '</tr>';
  };
  var thead5='<thead><tr style="border-bottom:2px solid var(--accent)">'+
    '<th style="padding:10px 12px;font-size:11px;color:var(--dim);text-align:left;font-weight:700;text-transform:uppercase">Indicador</th>'+
    '<th style="padding:10px 10px;font-size:12px;color:'+colA+';text-align:center;font-weight:800">'+fmtM(_cMA)+'</th>'+
    '<th style="padding:6px 8px;font-size:10px;color:var(--dim);text-align:center;font-weight:600;border-right:1px dashed var(--accent-soft)">vs Meta</th>'+
    '<th style="padding:10px 10px;font-size:12px;color:'+colB+';text-align:center;font-weight:800">'+fmtM(_cMB)+'</th>'+
    '<th style="padding:6px 8px;font-size:10px;color:var(--dim);text-align:center;font-weight:600;border-right:1px dashed var(--accent-soft)">vs Meta</th>'+
    '<th style="padding:10px 10px;font-size:11px;color:var(--dim);text-align:center;font-weight:700">Meta</th>'+
  '</tr></thead>';
  var tbl5=function(rows){return '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">'+thead5+'<tbody>'+rows+'</tbody></table></div>';};

  // ── 2-col row SIN meta ────────────────────────────────────────────────────
  var thead2='<thead><tr style="border-bottom:2px solid var(--accent)">'+
    '<th style="padding:10px 12px;font-size:11px;color:var(--dim);text-align:left;font-weight:700;text-transform:uppercase">Indicador</th>'+
    '<th style="padding:10px 12px;font-size:12px;color:'+colA+';text-align:center;font-weight:800">'+fmtM(_cMA)+'</th>'+
    '<th style="padding:10px 12px;font-size:12px;color:'+colB+';text-align:center;font-weight:800;border-left:2px solid var(--accent-soft)">'+fmtM(_cMB)+'</th>'+
  '</tr></thead>';
  var row2=function(label,vA,vB,higherBetter,fmt){
    if(higherBetter===undefined)higherBetter=true;
    if(!fmt)fmt=fN;
    var na=parseFloat(String(vA).replace(/[^0-9.-]/g,''));
    var nb=parseFloat(String(vB).replace(/[^0-9.-]/g,''));
    var arrow='',arrowCol='var(--dim)';
    if(!isNaN(na)&&!isNaN(nb)&&na!==nb){
      var better=higherBetter?nb>na:nb<na;
      arrow=nb>na?' &#8593;':' &#8595;';
      arrowCol=better?'#4ade80':'#f87171';
    }
    return '<tr style="border-bottom:1px solid var(--accent-soft)">'+
      '<td style="padding:9px 12px;font-size:12px;color:var(--dim);font-weight:600">'+label+'</td>'+
      '<td style="padding:9px 12px;font-size:13px;font-weight:700;color:'+colA+';text-align:center">'+fmt(vA)+'</td>'+
      '<td style="padding:9px 12px;font-size:13px;font-weight:700;color:'+colB+';text-align:center;border-left:2px solid var(--accent-soft)">'+fmt(vB)+'<span style="color:'+arrowCol+';font-size:11px">'+arrow+'</span></td>'+
    '</tr>';
  };
  var tbl2=function(rows){return '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">'+thead2+'<tbody>'+rows+'</tbody></table></div>';};

  // ── Sec helper: titulo + subtitulo + contenido ──────────────────────────
  var sec=function(titulo,subtitulo,contenido){
    return '<div class="section">'+
      '<h2>'+titulo+'</h2>'+
      (subtitulo?'<div class="sub">'+subtitulo+'</div>':'')+
      contenido+
    '</div>';
  };

  // ── Cap 01: Indicadores Generales ────────────────────────────────────────
  var mtLC=mt?mt.citas/mt.leads*100:null;
  var mtCV=mt?mt.visitas/mt.citas*100:null;
  var mtLV=mt?mt.visitas/mt.leads*100:null;
  var mtLG=mt?mt.cierres/mt.leads*100:null;

  var cap01='<div class="chapter">'+chapterHdr('01','Indicadores Generales')+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
      sec('Volumen y Embudo','Leads totales y avance por etapa del pipeline',
        tbl5(
          rowM('Total leads',mA.total,mB.total,mt?mt.leads:null)+
          rowM('Citas agendadas',mA.citas,mB.citas,mt?mt.citas:null)+
          rowM('Visitas realizadas',mA.visitas,mB.visitas,mt?mt.visitas:null)+
          rowM('Separaciones',mA.seps,mB.seps,null)+
          rowM('Ganados',mA.gan,mB.gan,mt?mt.cierres:null)+
          rowM('Perdidos',mA.per,mB.per,null,false)+
          rowM('Recuperables',mA.rec,mB.rec,null)
        )
      )+
      sec('Tasas de Conversión','Porcentaje de avance entre etapas del embudo',
        tbl2(
          row2('Contactación',mA.pCont,mB.pCont,true,fP)+
          row2('Lead → Cita',mA.pLC,mB.pLC,true,fP)+
          row2('Cita → Visita',mA.pCV,mB.pCV,true,fP)+
          row2('Lead → Visita',mA.pLV,mB.pLV,true,fP)+
          row2('Visita → Negociación',mA.pVN,mB.pVN,true,fP)+
          row2('Negociación → Cierre',mA.pNC,mB.pNC,true,fP)+
          row2('Lead → Ganado',mA.pLG,mB.pLG,true,fP)
        )
      )+
    '</div>'+
  '</div>';

  // ── Cap 02: Fuentes de Leads ─────────────────────────────────────────────
  var GRUPOS=[
    {lbl:'Digital Paga',     idxs:[0,1,13]},
    {lbl:'Digital Orgánica', idxs:[4,7,5,11]},
    {lbl:'POP',              idxs:[3,10,6,9]},
    {lbl:'BTL',              idxs:[8]},
    {lbl:'Otros',            idxs:[2,12]}
  ];
  var grupoRows=GRUPOS.map(function(g){
    var vA=g.idxs.reduce(function(s,i){return s+(mA.srcG[i]||0);},0);
    var vB=g.idxs.reduce(function(s,i){return s+(mB.srcG[i]||0);},0);
    if(!vA&&!vB)return '';
    var cA=g.idxs.reduce(function(s,i){return s+(mA.srcCita[i]||0);},0);
    var cB=g.idxs.reduce(function(s,i){return s+(mB.srcCita[i]||0);},0);
    var cvA=vA?fP(cA/vA*100):'-', cvB=vB?fP(cB/vB*100):'-';
    return row2(g.lbl+' (leads / conv.cita)',vA+' / '+cvA,vB+' / '+cvB);
  }).join('');

  var allSrcs=[...new Set([...Object.keys(mA.srcG),...Object.keys(mB.srcG)])].map(Number).sort(function(a,b){return(mB.srcG[b]||0)-(mB.srcG[a]||0);}).slice(0,8);
  var srcRows=allSrcs.map(function(s){
    var lbl=SRCS[s]||('src'+s);
    var vA=mA.srcG[s]||0, vB=mB.srcG[s]||0;
    var cA=mA.srcCita[s]||0, cB=mB.srcCita[s]||0;
    var cvA=vA?fP(cA/vA*100):'-', cvB=vB?fP(cB/vB*100):'-';
    return row2(lbl+' (leads / conv.cita)',vA+' / '+cvA,vB+' / '+cvB);
  }).join('');

  var cap02='<div class="chapter">'+chapterHdr('02','Fuentes de Leads')+
    sec('Resumen por Grupo de Canal','Leads totales y tasa de conversión a cita por tipo de canal',tbl2(grupoRows))+
    sec('Detalle por Fuente','Leads totales y tasa de conversión a cita por fuente individual',tbl2(srcRows))+
    sec('Campañas','Leads generados por campaña',
      tbl2(CAMPS.map(function(c,i){var vA=mA.campG[i]||0,vB=mB.campG[i]||0;return(vA||vB)?row2(c,vA,vB):'';}).join(''))
    )+
  '</div>';

  // ── Cap 03: Motivos de Pérdida ───────────────────────────────────────────
  var lrGrps=['Contactabilidad','Interes','Producto','Mal segmento','Otro'];
  var lrRows=lrGrps.map(function(g){return row2(g,mA.lrG[g]||0,mB.lrG[g]||0,false);}).join('');
  var pctLrRows=lrGrps.map(function(g){
    var pA=mA.per?fP((mA.lrG[g]||0)/mA.per*100):'-';
    var pB=mB.per?fP((mB.lrG[g]||0)/mB.per*100):'-';
    return row2(g+' (%)',pA,pB,false,function(v){return v;});
  }).join('');
  var cap03='<div class="chapter">'+chapterHdr('03','Motivos de Pérdida')+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
      sec('Volumen Absoluto','Número de leads perdidos por motivo de cierre',tbl2(lrRows))+
      sec('Distribución Porcentual','Participación de cada motivo sobre el total de perdidos',tbl2(pctLrRows))+
    '</div>'+
  '</div>';

  // ── Cap 04: Inversión en Pauta Digital ───────────────────────────────────
  var cap04='<div class="chapter">'+chapterHdr('04','Inversión en Pauta Digital')+
    sec('Eficiencia de Inversión','Costo por lead, cita, visita y cierre según inversión en pauta',
      tbl2(row2('Inversión total',mA.inv,mB.inv,true,fM)+
        row2('Leads digitales (IG+FB+WA)',mA.digL,mB.digL)+
        row2('CPL Digital',mA.cpl,mB.cpl,false,fC)+
        row2('CPL Meta (IG+FB)',mA.cplMeta,mB.cplMeta,false,fC)+
        row2('Costo / Cita',mA.cplCita,mB.cplCita,false,fC)+
        row2('Costo / Visita',mA.costoVis,mB.costoVis,false,fC)+
        row2('Costo / Cierre',mA.costoCierre,mB.costoCierre,false,fC))
    )+
  '</div>';

  // ── Cap 05: Gestión de Asesores ──────────────────────────────────────────
  var allAse=[...new Set([...Object.keys(mA.aseG),...Object.keys(mB.aseG)])].map(Number);
  var aseRows=allAse.map(function(i){
    var lbl=ASESORES[i]||('ase'+i);
    var lA=mA.aseG[i]||0, lB=mB.aseG[i]||0;
    var vA=mA.aseVis[i]||0, vB=mB.aseVis[i]||0;
    var cvA=lA?fP(vA/lA*100):'-', cvB=lB?fP(vB/lB*100):'-';
    return row2(lbl+' (leads / conv.vis)',lA+' / '+cvA,lB+' / '+cvB);
  }).join('');
  var cap05='<div class="chapter">'+chapterHdr('05','Gestión de Asesores')+
    sec('Rendimiento por Asesor','Leads asignados y tasa de conversión a visita por asesor',
      tbl2(aseRows||row2('Sin datos','-','-'))
    )+
  '</div>';

  document.getElementById('compContent').innerHTML=controls+cap01+cap02+cap03+cap04+cap05;
}


// Init
render();

// Tab navigation
document.querySelectorAll('.tab-nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    activeTab=btn.dataset.tab;
    render();
  });
});

</script>
</body>
</html>
